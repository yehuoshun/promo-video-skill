<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px; height: 1920px; overflow: hidden; position: relative;
    background: #07090d; color: #f2f4f7;
    font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif;
  }
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
    background-size: 64px 64px;
    mask-image: radial-gradient(120% 60% at 50% 22%, #000 30%, transparent 78%);
  }
  .glow { position: absolute; width: 1000px; height: 820px; left: -180px; top: -260px;
    background: radial-gradient(circle at 48% 50%, rgba(90,140,255,.22), transparent 62%); filter: blur(20px); }
  .glow2 { position: absolute; width: 760px; height: 760px; right: -240px; bottom: 40px;
    background: radial-gradient(circle at 50% 50%, rgba(142,240,200,.12), transparent 66%); filter: blur(24px); }

  .top { position: absolute; left: 74px; top: 132px; width: 930px; z-index: 3; }
  .kicker { font-size: 23px; letter-spacing: .2em; font-weight: 700; color: #8ef0c8; }
  .kicker i { font-style: normal; color: rgba(242,244,247,.45); letter-spacing: .16em; }
  h1 { margin-top: 34px; font-size: 106px; line-height: 1.16; font-weight: 800; letter-spacing: -.01em; }
  h1 .mint { color: #8ef0c8; }
  .sub { margin-top: 30px; font-size: 34px; line-height: 1.5; color: rgba(242,244,247,.72); font-weight: 500; }
  .sub em { font-style: normal; color: #f2f4f7; }

  .stage { position: absolute; left: 56px; right: 56px; top: 706px; height: 560px; z-index: 2;
    border-radius: 18px; overflow: hidden; box-shadow: 0 40px 120px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.14); }
  .stage img { width: 100%; display: block; }
  .stage::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(0deg, #07090d 16%, rgba(7,9,13,.35) 48%, rgba(7,9,13,0) 80%);
  }

  .term { position: absolute; left: 74px; right: 74px; bottom: 286px; z-index: 4;
    background: rgba(8,11,16,.94); border: 1px solid rgba(255,255,255,.14); border-radius: 20px;
    padding: 30px 34px; box-shadow: 0 30px 80px rgba(0,0,0,.72);
    font-family: "Cascadia Mono", "Consolas", monospace; font-size: 27px; line-height: 1.72; }
  .term .ln1 { color: rgba(242,244,247,.6); }
  .term .ln1 b { color: #f2f4f7; font-weight: 700; }
  .term .ln2 { color: #8ef0c8; font-weight: 700; font-size: 30px; }
  .term .ln2 u { text-decoration: none; color: rgba(242,244,247,.45); font-weight: 500; }
  .term .ln3 { color: rgba(242,244,247,.45); font-size: 25px; }

  .url { position: absolute; left: 0; right: 0; bottom: 208px; text-align: center; z-index: 4;
    font-family: "Cascadia Mono", "Consolas", monospace; font-size: 26px; color: rgba(242,244,247,.5); }
  .url .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: #8ef0c8;
    box-shadow: 0 0 14px #8ef0c8; margin-right: 12px; vertical-align: middle; }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="glow"></div>
  <div class="glow2"></div>

  <div class="top">
    <div class="kicker">YUQUE-IMPORT-SKILL <i>· 开源 MIT</i></div>
    <h1>一条命令<br><span class="mint">搬完</span>整个仓库</h1>
    <div class="sub">GitHub 仓库 → 语雀知识库<br><em>目录、文件名、层级</em>，原样搬过去</div>
  </div>

  <div class="stage"><img src="../public/yuque-toc.png"></div>

  <div class="term">
    <div class="ln1">PS&gt; python yuque_tree_import.py <b>--dry</b></div>
    <div class="ln2">1210 节点 <u>·</u> 83 目录 <u>·</u> 1127 文档</div>
    <div class="ln3">层级一条没少，直接入库</div>
  </div>

  <div class="url"><span class="dot"></span>github.com/yehuoshun/yuque-import-skill</div>
</body>
</html>
