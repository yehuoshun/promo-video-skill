<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px; height: 1440px; overflow: hidden; position: relative;
    background: #07090d; color: #f2f4f7;
    font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif;
  }
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
    background-size: 56px 56px;
    mask-image: radial-gradient(110% 60% at 20% 10%, #000 30%, transparent 80%);
  }
  .glow { position: absolute; width: 900px; height: 700px; left: -220px; top: -260px;
    background: radial-gradient(circle at 45% 45%, rgba(90,140,255,.22), transparent 62%); filter: blur(18px); }

  .top { position: absolute; left: 68px; top: 84px; width: 940px; z-index: 3; }
  .kicker { font-size: 22px; letter-spacing: .24em; color: rgba(242,244,247,.55); font-weight: 600; }
  .kicker b { color: #8ef0c8; letter-spacing: .24em; }
  .kicker .cn { letter-spacing: .08em; color: rgba(242,244,247,.62); }
  h1 { margin-top: 34px; font-size: 132px; line-height: 1.06; font-weight: 800; letter-spacing: -.02em; }
  h1 .mint { color: #8ef0c8; }
  .sub { margin-top: 28px; font-size: 34px; line-height: 1.5; color: rgba(242,244,247,.74); font-weight: 500; }
  .sub em { font-style: normal; color: #f2f4f7; }
  .chips { margin-top: 30px; display: flex; gap: 14px; }
  .chip { padding: 14px 22px; border: 1px solid rgba(255,255,255,.14); background: rgba(255,255,255,.05);
    border-radius: 999px; font-size: 26px; font-weight: 700; font-family: "Cascadia Mono", "Consolas", monospace; }
  .chip s { text-decoration: none; color: rgba(242,244,247,.5); font-weight: 500; }

  .stage { position: absolute; left: 68px; right: -80px; top: 800px; bottom: 0; z-index: 2; }
  .win { position: absolute; inset: 0; background: #fff; border-radius: 18px 18px 0 0; overflow: hidden;
    box-shadow: 0 30px 90px rgba(0,0,0,.65), 0 0 0 1px rgba(255,255,255,.14); }
  .win img { width: 138%; display: block; }
  .win::after {
    content: ""; position: absolute; inset: 0;
    background:
      linear-gradient(0deg, #07090d 7%, rgba(7,9,13,.06) 30%, rgba(7,9,13,0) 64%),
      linear-gradient(90deg, #07090d 0%, rgba(7,9,13,.38) 8%, rgba(7,9,13,0) 26%, rgba(7,9,13,.16) 100%);
  }
  .term { position: absolute; left: 40px; right: 60px; bottom: 130px; z-index: 4;
    background: rgba(8,11,16,.95); border: 1px solid rgba(255,255,255,.14); border-radius: 16px;
    padding: 24px 26px; box-shadow: 0 24px 70px rgba(0,0,0,.7);
    font-family: "Cascadia Mono", "Consolas", monospace; font-size: 25px; line-height: 1.66; }
  .term .ln1 { color: rgba(242,244,247,.55); }
  .term .ln1 b { color: #f2f4f7; font-weight: 700; }
  .term .ln2 { color: #8ef0c8; font-weight: 700; }
  .term .ln2 u { text-decoration: none; color: rgba(242,244,247,.45); font-weight: 500; }
  .url { position: absolute; left: 68px; bottom: 54px; z-index: 4; display: flex; align-items: center; gap: 14px;
    font-family: "Cascadia Mono", "Consolas", monospace; font-size: 24px; color: rgba(242,244,247,.6); }
  .url .dot { width: 10px; height: 10px; border-radius: 50%; background: #8ef0c8; box-shadow: 0 0 16px #8ef0c8; }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="glow"></div>

  <div class="top">
    <div class="kicker"><b>YUQUE-IMPORT-SKILL</b> · <span class="cn">开源 MIT</span></div>
    <h1>一条命令<br><span class="mint">搬完</span><br>整个仓库</h1>
    <div class="sub">GitHub 仓库 → 语雀知识库<br><em>目录、文件名、层级</em>，原样搬过去</div>
    <div class="chips">
      <div class="chip">1210 <s>个节点</s></div>
      <div class="chip">83 <s>个目录</s></div>
      <div class="chip">1127 <s>篇文档</s></div>
    </div>
  </div>

  <div class="stage">
    <div class="win"><img src="../public/yuque-toc.png"></div>
    <div class="term">
      <div class="ln1">PS&gt; python yuque_tree_import.py <b>--root</b> d2l-zh <b>--dry</b></div>
      <div class="ln2">1210 节点 <u>·</u> 83 目录 <u>·</u> 1127 文档</div>
    </div>
  </div>

  <div class="url"><span class="dot"></span>github.com/yehuoshun/yuque-import-skill</div>
</body>
</html>
