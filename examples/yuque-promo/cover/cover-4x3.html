<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1440px; height: 1080px; overflow: hidden; position: relative;
    background: #07090d; color: #f2f4f7;
    font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif;
  }
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
    background-size: 58px 58px;
    mask-image: radial-gradient(110% 85% at 18% 20%, #000 32%, transparent 80%);
  }
  .glow { position: absolute; width: 1000px; height: 780px; left: -240px; top: -280px;
    background: radial-gradient(circle at 42% 46%, rgba(90,140,255,.22), transparent 62%); filter: blur(18px); }
  .glow2 { position: absolute; width: 700px; height: 700px; right: -160px; bottom: -260px;
    background: radial-gradient(circle at 50% 50%, rgba(142,240,200,.13), transparent 66%); filter: blur(22px); }

  .left { position: absolute; left: 72px; top: 92px; width: 760px; z-index: 3; }
  .kicker { font-size: 20px; letter-spacing: .22em; color: rgba(242,244,247,.55); font-weight: 600; }
  .kicker b { color: #8ef0c8; letter-spacing: .22em; }
  .kicker .cn { letter-spacing: .08em; color: rgba(242,244,247,.6); }

  h1 { margin-top: 40px; font-size: 112px; line-height: 1.08; font-weight: 800; letter-spacing: -.02em; }
  h1 .mint { color: #8ef0c8; }

  .sub { margin-top: 34px; font-size: 31px; line-height: 1.52; color: rgba(242,244,247,.74); font-weight: 500; }
  .sub em { font-style: normal; color: #f2f4f7; }

  .chips { margin-top: 36px; display: flex; gap: 12px; flex-wrap: wrap; width: 700px; }
  .chip { padding: 13px 20px; border: 1px solid rgba(255,255,255,.14); background: rgba(255,255,255,.05);
    border-radius: 999px; font-size: 24px; font-weight: 700;
    font-family: "Cascadia Mono", "Consolas", monospace; white-space: nowrap; }
  .chip s { text-decoration: none; color: rgba(242,244,247,.5); font-weight: 500; }

  .url { position: absolute; left: 72px; bottom: 66px; z-index: 4; display: flex; align-items: center; gap: 14px;
    font-family: "Cascadia Mono", "Consolas", monospace; font-size: 23px; color: rgba(242,244,247,.62); }
  .url .dot { width: 9px; height: 9px; border-radius: 50%; background: #8ef0c8; box-shadow: 0 0 16px #8ef0c8; }

  .stage { position: absolute; right: -130px; top: 76px; width: 700px; height: 1030px; z-index: 2; }
  .win { position: absolute; inset: 0; background: #fff; border-radius: 18px; overflow: hidden;
    box-shadow: 0 36px 110px rgba(0,0,0,.65), 0 0 0 1px rgba(255,255,255,.16); }
  .win img { width: 112%; display: block; }
  .win::after {
    content: ""; position: absolute; inset: 0;
    background:
      linear-gradient(0deg, #07090d 5%, rgba(7,9,13,.08) 34%, rgba(7,9,13,0) 66%),
      linear-gradient(90deg, #07090d 0%, rgba(7,9,13,.55) 12%, rgba(7,9,13,.02) 42%, rgba(7,9,13,.42) 100%);
  }
  .term { position: absolute; left: -240px; bottom: 150px; width: 720px; z-index: 4;
    background: rgba(8,11,16,.95); border: 1px solid rgba(255,255,255,.14); border-radius: 15px;
    padding: 22px 26px; box-shadow: 0 26px 70px rgba(0,0,0,.7); backdrop-filter: blur(6px);
    font-family: "Cascadia Mono", "Consolas", monospace; font-size: 21px; line-height: 1.68; }
  .term .ln1 { color: rgba(242,244,247,.55); }
  .term .ln1 b { color: #f2f4f7; font-weight: 700; }
  .term .ln2 { color: #8ef0c8; font-weight: 700; }
  .term .ln2 u { text-decoration: none; color: rgba(242,244,247,.45); font-weight: 500; }
  .term .ln3 { color: rgba(242,244,247,.45); font-size: 20px; }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="glow"></div>
  <div class="glow2"></div>

  <div class="left">
    <div class="kicker"><b>YUQUE-IMPORT-SKILL</b> · <span class="cn">开源 MIT</span></div>
    <h1>一条命令<br><span class="mint">搬完</span>整个仓库</h1>
    <div class="sub">GitHub 仓库 → 语雀知识库<br><em>目录、文件名、层级</em>，原样搬过去</div>
    <div class="chips">
      <div class="chip">1210 <s>个节点</s></div>
      <div class="chip">83 <s>个目录</s></div>
      <div class="chip">1127 <s>篇文档</s></div>
    </div>
  </div>

  <div class="stage">
    <div class="win"><img src="../public/yuque-toc.png"></div>
    <div class="term">
      <div class="ln1">PS&gt; python yuque_tree_import.py <b>--root</b> d2l-zh <b>--dry</b></div>
      <div class="ln2">1210 节点 <u>·</u> 83 目录 <u>·</u> 1127 文档</div>
      <div class="ln3">层级一条没少，直接入库</div>
    </div>
  </div>

  <div class="url"><span class="dot"></span>github.com/yehuoshun/yuque-import-skill</div>
</body>
</html>
