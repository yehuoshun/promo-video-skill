<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>promo-video-skill · 静帧验收</title>
<style>
  /* 换配色只改这三行 */
  :root{
    --accent:#8ef0c8;
    --ink:#f2f4f7;
    --bg:#07090d;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1920px;height:1080px;overflow:hidden;background:var(--bg)}
  body{
    font-family:"Microsoft YaHei","PingFang SC","Noto Sans SC",sans-serif;
    color:var(--ink);
    position:relative;
  }

  /* 底色：径向光 + 噪点网格 */
  .bg{
    position:absolute;inset:0;
    background:
      radial-gradient(1200px 700px at 72% 26%, rgba(142,240,200,.14), transparent 62%),
      radial-gradient(900px 600px at 18% 96%, rgba(90,140,255,.12), transparent 65%),
      linear-gradient(160deg,#0b0f15 0%,#07090d 55%,#05070a 100%);
  }
  .grid{
    position:absolute;inset:0;
    background-image:
      linear-gradient(to right, rgba(255,255,255,.055) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(255,255,255,.055) 1px, transparent 1px);
    background-size:80px 80px;
    -webkit-mask-image:radial-gradient(80% 70% at 50% 40%, #000 30%, transparent 100%);
            mask-image:radial-gradient(80% 70% at 50% 40%, #000 30%, transparent 100%);
  }
  .glow{
    position:absolute;width:760px;height:760px;right:-140px;top:-160px;border-radius:50%;
    background:radial-gradient(circle, rgba(142,240,200,.22), transparent 68%);
    filter:blur(20px);
  }

  .stage{position:absolute;inset:0;padding:112px 128px;display:flex;flex-direction:column;justify-content:space-between}

  /* 主内容块在剩余空间里垂直居中，避免上下留白不均 */
  .main{flex:1;display:flex;flex-direction:column;justify-content:center;padding:24px 0 40px}

  .kicker{
    display:inline-flex;align-items:center;gap:14px;
    font-size:17px;letter-spacing:.42em;text-transform:uppercase;
    color:rgba(242,244,247,.52);font-weight:600;
  }
  .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 18px var(--accent)}

  h1{
    font-size:104px;line-height:1.14;font-weight:800;letter-spacing:-.02em;margin-top:44px;
    max-width:1240px;
  }
  h1 em{
    font-style:normal;color:var(--accent);position:relative;white-space:nowrap;
  }
  h1 em::after{
    content:"";position:absolute;left:0;right:0;bottom:6px;height:12px;
    background:var(--accent);opacity:.16;border-radius:3px;
  }
  .sub{
    margin-top:34px;font-size:30px;line-height:1.7;color:rgba(242,244,247,.62);max-width:1080px;font-weight:400;
  }

  .chips{display:flex;gap:18px;margin-top:52px}
  .chip{
    padding:16px 26px;border-radius:999px;font-size:24px;
    border:1px solid rgba(255,255,255,.14);
    background:rgba(255,255,255,.04);
    color:rgba(242,244,247,.86);
    backdrop-filter:blur(6px);
  }
  .chip b{color:var(--accent);font-weight:700;margin-right:10px}

  .foot{
    display:flex;justify-content:space-between;align-items:flex-end;
    border-top:1px solid rgba(255,255,255,.1);padding-top:34px;
    font-size:20px;color:rgba(242,244,247,.42);
    font-family:"Cascadia Mono","Consolas",monospace;letter-spacing:.02em;
  }
  .foot .right{color:rgba(142,240,200,.72)}
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="grid"></div>
  <div class="glow"></div>

  <div class="stage">
    <div class="main">
      <div class="kicker"><span class="dot"></span>promo-video-skill · p0</div>
      <h1>把一支宣传片，<br>写成 <em>AI 能执行</em> 的规范。</h1>
      <p class="sub">不是提示词，是带秒数、带配额、带闸门的施工图。跑不通就报错，而不是「看起来还行」。</p>
      <div class="chips">
        <div class="chip"><b>01</b>两轮问询</div>
        <div class="chip"><b>02</b>节奏底线</div>
        <div class="chip"><b>03</b>会 fail 的闸门</div>
      </div>
    </div>

    <div class="foot">
      <div>static frame · 验收样张</div>
      <div class="right">3840 × 2160 · shot.ps1</div>
    </div>
  </div>
</body>
</html>
